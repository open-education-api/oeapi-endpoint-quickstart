spring.sql.init.mode=always

# Cap the eager join depth.
#
# Almost every @ManyToOne in oeapi.model is left at the JPA default, which is EAGER, and
# Organisation.parent / CourseOffering.programmeOffering make that graph self-referential.
# Hibernate 7 resolves the whole closure in a single statement, so loading one Offering by
# id (all three subclasses are in one table) joins 60+ tables and MySQL refuses:
#
#   ERROR 1116 (HY000): Too many tables; MySQL can only use 61 tables in a join
#
# hibernate.max_fetch_depth defaults to 0, meaning "no limit". Capping it makes Hibernate
# stop joining past that depth and issue follow-up selects instead - same data, same
# eager semantics, just more round trips. Lower it to 1 if a deeper entity still trips
# the 61-table limit.
#
# The alternative - marking those associations LAZY - is not a drop-in here: the
# controllers serialize entities directly and no Hibernate module is registered with
# Jackson, so proxies would leak into the JSON.
spring.jpa.properties.hibernate.max_fetch_depth=2

#spring.jpa.show-sql=true

spring.jackson.default-property-inclusion=non-null

# Migration escape hatch, off by default.
#
# Jackson 3 changed serialization defaults - dates become ISO-8601 strings rather than
# numeric timestamps, among others. Turning this on restores the Jackson 2 defaults, which
# is useful for exactly one thing: proving that a failing test is a broken import rather
# than a changed output format. Turn it on, get the suite green, turn it off again, and
# whatever moves the second time is the real behaviour change.
#
#spring.jackson.use-jackson2-defaults=true

