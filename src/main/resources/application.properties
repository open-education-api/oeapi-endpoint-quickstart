# Security
#
# Securing update operations. If true jwt will verify requests for data updates and management
# Ensure that your endpoint is secured behind a proxy (in that case this param can be false) or activating jwt
ooapi.security.enabled=false

# Security modes:
#   - none: security disabled (ooapi.security.enabled=false)
#   - guest: Read only access, not updates allowed in any way
#   - restricted: Readable with authorized updates (us/pass or app token)
#   - private: Read and Updates require authorization
ooapi.security.mode=none

