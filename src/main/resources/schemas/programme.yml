type: object
properties:
  primaryCode:
    type: object
    properties:
      codeType:
        type: string
      code:
        type: string
    required: ["codeType", "code"]
  name:
    type: array
    items:
      type: object
      properties:
        language:
          type: string
          enum: ["bg-BG","hr-HR","cs-CZ","da-DK","nl-NL","en-GB","et-EE","fi-FI","fr-FR","de-DE","el-GR","hu-HU","ga-IE","it-IT","lv-LV","lt-LT","mt-MT","pl-PL","pt-PT","ro-RO","sk-SK","sl-SI","es-ES","sv-SE","ca-ES","eu-ES","gl-ES","no-NO","is-IS","de-CH","fr-CH","it-CH","rm-CH","cy-GB","gd-GB","sr-RS","bs-BA","cnr-ME","mk-MK","sq-AL"]
        value:
          type: string
      required: ["language", "value"]
  description:
    type: array
    items:
      type: object
      properties:
        language:
          type: string
        value:
          type: string
      required: ["language", "value"]
  programmeId:
    type: string
    format: uuid # Validate UUID format
  teachingLanguages:
    type: array
    items:
      type: string
      pattern: '^([a-z]{2,3})(-([A-Z]{2}|[0-9]{3}))?(-([a-z]{4}))?(-([a-z]{2}|[0-9]{3}))*(-[a-z0-9]{2,8})*(-x(-[a-z0-9]{1,8})+)?$'
  abbreviation:
    type: string
  level:
    type: string
  programmeType:
    type: string
required: ["name","programmeType","teachingLanguages","abbreviation","description","level"]
