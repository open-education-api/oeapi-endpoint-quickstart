type: object
properties:
  primaryCode:
    type: object
    properties:
      codeType:
        type: string
      code:
        type: string
    required: ["codeType", "code"]
  groupId:
    type: string
    format: uuid
  groupType:
    type: string   # OEAPI v6 extensible enumeration, see enum/groupType.yml
  name:
    type: array
    items:
      type: object
      properties:
        language:
          type: string
        value:
          type: string
      required: ["language", "value"]
required: ["primaryCode","name","groupType"]
