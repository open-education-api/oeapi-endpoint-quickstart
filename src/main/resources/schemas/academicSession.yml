type: object
properties:

  academicSessionType:
    type: string
    # OEAPI v6 extensible enumeration, see enum/academicSessionType.yml
  primaryCode:
    type: object
    properties:
      codeType:
        type: string
        enum: ["identifier", "uuid", "otherType"] # Enumerated values
      code:
        type: string
    required: ["codeType", "code"]
  startDateTime:
    type: string
    format: date-time
  endDateTime:
    type: string
    format: date-time
  name:
    type: array
    items:
      type: object
      properties:
        language:
          type: string
        value:
          type: string
      required: ["language", "value"]
required: ["startDateTime","name", "endDateTime"]
