type: object
properties:
  primaryCode:
    type: object
    properties:
      codeType:
        type: string
      code:
        type: string
    required: ["codeType", "code"]
  name:
    type: array
    items:
      type: object
      properties:
        language:
          type: string
        value:
          type: string
      required: ["language", "value"]
  description:
    type: array
    items:
      type: object
      properties:
        language:
          type: string
        value:
          type: string
      required: ["language", "value"]
  offeringId:
    type: string
    format: uuid # Validate UUID format
  teachingLanguages:
    type: array
    items:
      type: string
      pattern: '^([a-z]{2,3})(-([A-Z]{2}|[0-9]{3}))?(-([a-z]{4}))?(-([a-z]{2}|[0-9]{3}))*(-[a-z0-9]{2,8})*(-x(-[a-z0-9]{1,8})+)?$'
  resultExpected:
    type: boolean
required: ["primaryCode", "name"]
