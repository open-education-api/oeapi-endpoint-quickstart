# OEAPI v6 Person: primaryCode and activeEnrolment are required, together with
# at least one of surname, givenName or preferredName.
type: object
properties:
  primaryCode:
    type: object
    properties:
      codeType:
        type: string
      code:
        type: string
    required: ["codeType", "code"]
  personId:
    type: string
    format: uuid
  givenName:
    type: string
  preferredName:
    type: string
  surname:
    type: string
  displayName:
    type: string
  activeEnrolment:
    type: boolean
  affiliations:
    type: array
    items:
      type: string
  email:
    type: string
    format: email
  secondaryEmail:
    type: string
    format: email
  dateOfBirth:
    type: string
    format: date
  languageOfChoice:
    type: array
    items:
      type: string
required: ["primaryCode", "activeEnrolment"]
anyOf:
  - required: ["surname"]
  - required: ["givenName"]
  - required: ["preferredName"]
